name: Generer les videos dans le cloud

on:
  workflow_dispatch:
  push:
    paths:
      - 'cloud/projects/**'
      - 'cloud/generate.py'

permissions:
  contents: write

jobs:
  generer:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer FFmpeg et edge-tts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --quiet edge-tts

      - name: Generer les videos
        working-directory: cloud
        run: python generate.py

      - name: Publier les resultats dans le depot
        run: |
          git config user.name "BusinessOS Bot"
          git config user.email "bot@businessos.local"
          git add cloud/output || true
          git diff --cached --quiet || git commit -m "Videos generees dans le cloud"
          git push || true
